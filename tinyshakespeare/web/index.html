<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>smol RNN Shakespeare</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">vanilla char-RNN, client-side</p>
          <h1>smol RNN Shakespeare</h1>
          <p class="subtitle">
            A tiny hand-built recurrent network generating text in your browser.
            No backend, no framework, just checkpoint weights and JavaScript.
          </p>
        </div>
        <div class="stats" aria-label="model stats">
          <div>
            <span>checkpoint</span>
            <strong id="iteration">...</strong>
          </div>
          <div>
            <span>loss_ce</span>
            <strong id="loss-ce">...</strong>
          </div>
          <div>
            <span>vocab</span>
            <strong id="vocab-size">...</strong>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="controls">
          <label class="control control-wide">
            <span>Seed text</span>
            <textarea id="seed" rows="3">KING RICHARD:</textarea>
          </label>

          <label class="control">
            <span>Temperature</span>
            <input id="temperature" type="range" min="0.35" max="1.3" step="0.05" value="0.4" />
            <output id="temperature-value">0.40</output>
          </label>

          <label class="control">
            <span>Type delay</span>
            <input id="char-delay" type="range" min="0" max="60" step="5" value="15" />
            <output id="char-delay-value">15ms</output>
          </label>

          <label class="checkbox">
            <input id="use-checkpoint-state" type="checkbox" checked />
            <span>start from saved hidden state</span>
          </label>

          <div class="buttons">
            <button id="start" type="button">Start</button>
            <button id="pause" class="secondary" type="button">Pause</button>
            <button id="reset" class="secondary" type="button">Reset</button>
          </div>

          <div class="presets">
            <button data-seed="KING RICHARD:" type="button">KING RICHARD</button>
            <button data-seed="First Citizen:" type="button">First Citizen</button>
            <button data-seed="CLAUDIO:" type="button">CLAUDIO</button>
            <button data-seed="Misha:" type="button">Misha test</button>
          </div>
        </div>

        <pre id="output" class="output" aria-live="polite"></pre>
      </section>
    </main>

    <script src="model.js"></script>
    <script src="app.js"></script>
  </body>
</html>
